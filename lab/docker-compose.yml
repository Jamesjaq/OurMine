version: '3.8'

services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "8081:80"
    environment:
      - MYSQL_PASS=password

  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "8082:3000"

  webgoat:
    image: webgoat/webgoat:latest
    ports:
      - "8083:8080"
      - "9090:9090"
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBGOAT_PORT=8080
