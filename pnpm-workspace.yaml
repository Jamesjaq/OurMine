packages:
  - 'packages/*'
  - 'packages/console/*'
  - 'packages/sdk/*'
  - 'packages/sdk/js'
  - 'packages/stats/*'
allowBuilds:
  '@ibm/plex': set this to true or false
  '@parcel/watcher': set this to true or false
  '@sentry/cli': set this to true or false
  electron-winstaller: set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  tree-sitter-bash: set this to true or false
  tree-sitter-powershell: set this to true or false
  workerd: set this to true or false
